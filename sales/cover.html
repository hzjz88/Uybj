<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1160px;height:464px;overflow:hidden}
  .cover{
    width:1160px;height:464px;position:relative;display:flex;align-items:center;
    font-family:'Inter',sans-serif;color:#efe9df;
    background:
      radial-gradient(620px 420px at 78% 50%, rgba(210,162,76,.22), transparent 62%),
      radial-gradient(700px 500px at 8% 120%, rgba(120,80,20,.18), transparent 60%),
      linear-gradient(125deg,#0c0a08 0%, #15110b 55%, #0a0807 100%);
  }
  /* subtle vignette + top hairline */
  .cover::after{content:"";position:absolute;inset:0;
    box-shadow:inset 0 0 140px rgba(0,0,0,.7);
    border-top:1px solid rgba(210,162,76,.25);}
  .left{padding:0 56px 0 64px;max-width:680px;position:relative;z-index:3}
  .kicker{font-size:14px;letter-spacing:.34em;text-transform:uppercase;color:#d2a24c;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:12px}
  .kicker .ln{width:34px;height:1px;background:linear-gradient(90deg,#d2a24c,transparent)}
  h1{font-family:'Playfair Display',serif;font-weight:800;font-size:84px;line-height:.96;letter-spacing:-1px;margin-bottom:20px}
  h1 .g{background:linear-gradient(100deg,#f0d8a0,#d2a24c 55%,#a9781f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:#cfc6b6;line-height:1.35;max-width:560px;margin-bottom:24px}
  .meta{display:flex;align-items:center;gap:16px}
  .formen{border:1px solid rgba(210,162,76,.45);border-radius:6px;padding:7px 13px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#e7c075;font-weight:600}
  .dot{width:5px;height:5px;border-radius:50%;background:#6f675b}
  .tag{font-size:14px;letter-spacing:.05em;color:#9b9183}
  /* right emblem */
  .emblem{position:absolute;right:78px;top:50%;transform:translateY(-50%);z-index:2;
    width:250px;height:250px;border-radius:50%;
    border:1px solid rgba(210,162,76,.35);
    display:flex;align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(circle at 50% 38%, rgba(210,162,76,.16), rgba(20,16,11,.2) 70%);
    box-shadow:0 0 70px rgba(210,162,76,.18), inset 0 0 50px rgba(0,0,0,.5);}
  .emblem .ring{position:absolute;inset:16px;border-radius:50%;border:1px solid rgba(210,162,76,.18)}
  .emblem .roman{font-family:'Playfair Display',serif;font-size:58px;font-weight:700;color:#e7c075;line-height:1}
  .emblem .ed{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#9b9183;margin-top:10px}
  .emblem .men{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#7f7665;margin-top:4px}
</style>
</head>
<body>
  <div class="cover">
    <div class="left">
      <div class="kicker"><span class="ln"></span>A Complete System · For Men</div>
      <h1>The <span class="g">Chosen</span><br>Man</h1>
      <div class="sub">Become the man a quality woman chooses, commits to,<br>and won't risk losing.</div>
      <div class="meta">
        <span class="formen">For Men Only</span>
        <span class="dot"></span>
        <span class="tag">No games · No pickup lines · The seven shifts that change everything</span>
      </div>
    </div>
    <div class="emblem">
      <div class="ring"></div>
      <div>
        <div class="roman">VII</div>
        <div class="ed">The Seven Shifts</div>
        <div class="men">Edition One</div>
      </div>
    </div>
  </div>
</body>
</html>
